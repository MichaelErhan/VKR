<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Планирование ремонта</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1C1E22;
            --panel: #26292E;
            --panel-alt: #2E3238;
            --border: #3A3E44;
            --text: #EDEBE6;
            --text-muted: #9BA1A8;
            --accent: #E8A33D;
            --accent-dark: #B87B1F;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 18px 0;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.02em;
            padding: 8px 16px;
            border-radius: 4px;
            transition: color 0.2s, background-color 0.2s;
        }

        nav a:hover {
            color: var(--text);
            background-color: var(--panel-alt);
        }

        .user-info {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 100;
        }

        .user-info .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--panel-alt);
            border: 2px solid var(--accent);
            margin-right: 10px;
        }

        .usernametext {
            font-size: 15px;
            font-weight: 600;
            margin-right: 12px;
        }

        .user-info a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            margin-left: 14px;
            transition: color 0.2s;
        }

        .user-info a:hover {
            color: var(--accent);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin-top: 40px;
            font-size: 24px;
            text-align: center;
            position: relative;
            padding-bottom: 16px;
        }

        h1::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 4px;
            background: repeating-linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent) 6px,
                    var(--panel-alt) 6px,
                    var(--panel-alt) 12px
            );
            border-radius: 2px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            max-width: 420px;
            padding: 0 24px;
        }

        form label {
            align-self: flex-start;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: -4px;
        }

        form input, form textarea {
            padding: 10px 12px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            border-radius: 4px;
            border: 1px solid var(--border);
            outline: none;
            width: 100%;
            background-color: var(--panel);
            color: var(--text);
            transition: border-color 0.2s;
        }

        form input:focus, form textarea:focus {
            border-color: var(--accent);
        }

        form button {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #1C1E22;
            background-color: var(--accent);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        form button:hover {
            background-color: var(--accent-dark);
        }

        table {
            width: 90%;
            max-width: 1100px;
            margin-top: 30px;
            margin-bottom: 40px;
            border-collapse: collapse;
            text-align: left;
            background: var(--panel);
            border-radius: 6px;
            overflow: hidden;
            border-top: 3px solid var(--accent);
        }

        table th, table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        table th {
            background-color: var(--panel-alt);
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 12px;
            color: var(--text-muted);
        }

        table tr:hover td {
            background-color: var(--panel-alt);
        }

        p {
            margin-top: 20px;
            font-size: 15px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Главная</a>
    <a href="/parts-delivery">Список доставок запчастей</a>
</nav>

<div class="user-info" th:if="${username}">
    <div class="avatar"></div>
    <span class="usernametext" th:text="${username}"></span>
    <a href="/logout"><i class="fas fa-sign-out-alt"></i> Выйти</a>
</div>

<h1>Планирование ремонта</h1>

<form action="/repairs/filter" method="get">
    <label for="title">Марка и гос. номер:</label>
    <input type="text" id="title" name="title" placeholder="Введите марку и гос. номер">

    <label for="publicationDate">Дата записи:</label>
    <input type="Date" id="publicationDate" name="publicationDate" placeholder="Введите дату записи">

    <label for="author">Автор:</label>
    <input type="text" id="author" name="author" placeholder="Введите имя автора">

    <label for="content">Оказываемые услуги:</label>
    <textarea id="content" name="content" placeholder="Введите оказываемые услуги"></textarea>

    <label for="mechanicName">Имя специалиста:</label>
    <input type="text" id="mechanicName" name="mechanicName" placeholder="Введите имя специалиста">

    <button type="submit">Найти</button>
</form>

<table class="service-table">
    <thead>
    <tr>
        <th>Марка и гос. номер</th>
        <th>Дата записи</th>
        <th>Автор</th>
        <th>Оказываемые услуги</th>
        <th>Имя специалиста</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="repairBooking : ${repairBookings}">
        <td th:text="${repairBooking.title}"></td>
        <td th:text="${repairBooking.publicationDate}"></td>
        <td th:text="${repairBooking.author.userName}"></td>
        <td th:text="${repairBooking.content}"></td>
        <td th:text="${repairBooking.mechanicName}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
