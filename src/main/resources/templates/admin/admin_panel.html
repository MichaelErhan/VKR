<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Админка</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1C1E22;
            --panel: #26292E;
            --panel-alt: #2E3238;
            --border: #3A3E44;
            --text: #EDEBE6;
            --text-muted: #9BA1A8;
            --accent: #E8A33D;
            --accent-dark: #B87B1F;
            --danger: #C4553C;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 18px;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        nav a:hover {
            background-color: var(--panel-alt);
        }

        .user-info {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .user-info .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--panel-alt);
            border: 2px solid var(--accent);
            margin-right: 10px;
        }

        .usernametext {
            font-size: 18px;
            font-weight: bold;
            margin-right: 10px;
        }

        .user-info a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 16px;
            margin-left: 15px;
        }

        .user-info a:hover {
            color: var(--accent);
        }

        h1 {
            margin-top: 40px;
            font-size: 28px;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        form input {
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid var(--border);
            outline: none;
            width: 300px;
            background: var(--panel);
            color: var(--text);
        }

        form button {
            padding: 10px 20px;
            font-size: 16px;
            color: #1C1E22;
            background-color: var(--accent);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        form button:hover {
            background-color: var(--accent-dark);
        }

        form select {
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
        }

        .alert-error {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 5px;
            background: rgba(196, 85, 60, 0.15);
            border: 1px solid var(--danger);
            font-size: 15px;
        }

        .add-user h2 {
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 18px;
            margin: 40px 0 0;
            text-align: center;
        }

        table {
            width: 80%;
            margin-top: 30px;
            border-collapse: collapse;
            text-align: left;
            background: var(--panel);
        }

        table th, table td {
            padding: 10px;
            border: 1px solid var(--border);
        }

        table th {
            background-color: var(--panel-alt);
        }

        p {
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<div class="user-info" th:if="${username}">
    <div class="avatar"></div>
    <span class="usernametext" th:text="${username}"></span>
    <a href="/logout"><i class="fas fa-sign-out-alt"></i> Выйти</a>
</div>

<h1>Панель администратора</h1>
<div class="alert-error" th:if="${error}" th:text="${error}"></div>
<form method="post" th:action="@{/update}">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Имя пользователя</th>
            <th>Роль</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="userItem : ${users}">
            <td th:text="${userItem.id}"></td>
            <td th:text="${userItem.userName}"></td>
            <td>
                <select th:name="'roles[' + ${userItem.id} + ']'">
                    <option th:value="'ADMIN'" th:selected="${userItem.role.toString() == 'ADMIN'}">Администратор</option>
                    <option th:value="'MANAGER'" th:selected="${userItem.role.toString() == 'MANAGER'}">Менеджер</option>
                </select>
            </td>
            <td>
                <button type="submit" name="deleteUser" th:value="${userItem.id}">Удалить</button>
            </td>
        </tr>
        </tbody>
    </table>
    <button type="submit" name="saveRoles">Сохранить изменения</button>
</form>

<div class="add-user">
    <h2>Новый пользователь</h2>
    <form method="post" th:action="@{/admin_panel/add}">
        <input type="text" name="userName" placeholder="Имя пользователя" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <select name="role">
            <option value="MANAGER">Менеджер</option>
            <option value="ADMIN">Администратор</option>
        </select>
        <button type="submit">Создать</button>
    </form>
</div>
</body>
</html>
